
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#240046">
<title>STRIPON</title>

<style>
:root {
  --bg: #16002E;
  --purple: #240046;
  --electric: #7B2CBF;
  --lavender: #C084FC;
  --blue: #2563EB;
  --white: #FFFFFF;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at top, #53118C, transparent 45%),
    linear-gradient(145deg, #240046, #100020);
}

/* HEADER */

header {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(120deg, #240046, #3B0764);
  border-bottom: 1px solid #C084FC;
  box-shadow: 0 5px 25px #7B2CBF55;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 36px;
  font-weight: 1000;
  letter-spacing: 3px;
  text-shadow:
    0 0 8px white,
    0 0 18px #C084FC,
    0 0 30px #7B2CBF;
}

/* MAIN */

main {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px 110px;
}

.banner {
  padding: 30px 22px;
  min-height: 145px;
  border-radius: 24px;
  margin-bottom: 28px;
  background: linear-gradient(120deg, #7B2CBF, #3B0764, #173A91);
  border: 1px solid #C084FC;
  box-shadow: 0 0 25px #7B2CBF55;
}

.banner h2 {
  font-size: 30px;
  margin-bottom: 12px;
}

.banner p {
  color: #F3E8FF;
}

.section-title {
  font-size: 21px;
  margin: 25px 0 18px;
  text-shadow: 0 0 10px #C084FC;
}

/* CATEGORIES */

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.category {
  min-height: 155px;
  border-radius: 22px;
  padding: 18px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 15px;
  cursor: pointer;
  text-decoration: none;
  color: white;
  background: linear-gradient(145deg, #7026B5, #3B0764, #20246D);
  border: 1px solid #C084FC;
  box-shadow: 0 5px 18px #0005;
  transition: .2s;
}

.category:active {
  transform: scale(.95);
  box-shadow: 0 0 25px #A855F7;
}

.icon-box {
  width: 68px;
  height: 68px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #C084FC, #7B2CBF, #2563EB);
  box-shadow: 0 0 18px #A855F7;
}

.icon-box svg {
  width: 35px;
  height: 35px;
  fill: none;
  stroke: white;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.category-name {
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 0 8px #C084FC;
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  min-height: 76px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(25,0,50,.97);
  border-top: 1px solid #A855F7;
  box-shadow: 0 -5px 20px #7B2CBF55;
  z-index: 50;
}

.nav-item {
  flex: 1;
  height: 65px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #C084FC;
  text-decoration: none;
  font-size: 10px;
  cursor: pointer;
}

.nav-item svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-item.active {
  color: white;
  text-shadow: 0 0 10px #C084FC;
  box-shadow: inset 0 -3px #C084FC;
}

@media(max-width:380px) {
  .logo {font-size:29px;}
  .category {min-height:140px;}
  .nav-item {font-size:9px;}
}
</style>
</head>

<body>

<header>
  <div class="logo">STRIPON</div>
</header>

<main>

  <section class="banner">
    <h2>Explore STRIPON</h2>
    <p>Discover. Connect. Enjoy.</p>
  </section>

  <h2 class="section-title">Discover Categories</h2>

  <div class="categories">

    <!-- HOME -->

    <a class="category" href="home.html">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9v12h14V9"/>
          <path d="M9 21v-7h6v7"/>
        </svg>
      </div>

    </a>

    <!-- SHORTS -->

    <a class="category" href="./shorts.html">
      <div class="icon-box">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="3" width="16" height="18" rx="4"/>
          <path d="M10 8l6 4-6 4z"/>
        </svg>
      </div>

    <!-- GAMING -->

    <a class="category" href="gaming.html">

        </svg>
      </div>
      <span class="category-name">Gaming</span>

    <!-- POSTING -->

    <a class="category" href="posting.html">

        </svg>
      </div>

    <!-- MESSAGING -->

    <a class="category" href="messaging.html">
      <div class="icon-box">

        </svg>
      </div>
      <span class="category-name">Messaging</span>

    <!-- PROFILE -->

    <a class="category" href="profile.html">

        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
      </div>
      <span class="category-name">Profile</span>
    </a>

  </div>
</main>

<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

  <a class="nav-item active" href="home.html">
    <svg viewBox="0 0 24 24">
      <path d="M3 10.5L12 3l9 7.5M5 9v12h14V9"/>
    </svg>
    <span>Home</span>
  </a>

  <a class="nav-item" href="./shorts.html">
    <svg viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="18" rx="4"/>
      <path d="M10 8l6 4-6 4z"/>
    </svg>
    <span>Shorts</span>
  </a>

  <a class="nav-item" href="gaming.html">
    <svg viewBox="0 0 24 24">
      <path d="M6 8h12a4 4 0 0 1 4 5l-1.5 5a2 2 0 0 1-3 1l-3-2H9l-3 2a2 2 0 0 1-3-1l-1.5-5a4 4 0 0 1 4-5z"/>
    </svg>
    <span>Gaming</span>
  </a>

  <a class="nav-item" href="posting.html">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="4"/>
      <path d="M12 8v8M8 12h8"/>
    </svg>
    <span>Posting</span>
  </a>

  <a class="nav-item" href="messaging.html">
    <svg viewBox="0 0 24 24">
      <path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.4L3 21l2-5.3A8.5 8.5 0 1 1 21 11.5z"/>
    </svg>
    <span>Messages</span>
  </a>

  <a class="nav-item" href="profile.html">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>

    <span>Profile</span>

</nav>

</body>
</html>
